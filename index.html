<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Coin Market</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    .header {
      background: #111827;
      color: white;
      padding: 22px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 7px 0 0;
      opacity: .8;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
    }

    .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 18px;
      outline: none;
    }

    .result {
      margin-top: 18px;
      padding: 18px;
      background: #f0fdf4;
      border-radius: 14px;
      text-align: center;
    }

    .coins {
      font-size: 18px;
      color: #166534;
    }

    .money {
      margin-top: 8px;
      font-size: 32px;
      font-weight: bold;
      color: #15803d;
    }

    .rate {
      margin-top: 8px;
      color: #666;
      font-size: 14px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      background: #2563eb;
      color: white;
    }

    .info {
      font-size: 14px;
      line-height: 1.6;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🪙 Top Coin Market</h1>
    <p>Coin-এর মূল্য অটো হিসাব করুন</p>
  </div>

  <div class="container">

    <div class="card">

      <div class="title">কয়েনের পরিমাণ দিন</div>

      <label for="coinInput">Coins</label>

      <input
        id="coinInput"
        type="number"
        min="0"
        placeholder="যেমন: 1000"
        oninput="calculateMoney()"
      >

      <div class="result">

        <div class="coins">
          🪙 <span id="showCoins">0</span> Coins
        </div>

        <div class="money">
          ৳ <span id="showMoney">0.00</span>
        </div>

        <div class="rate">
          1,000 Coins = ৳4
        </div>

      </div>

      <button onclick="calculateMoney()">
        💰 হিসাব করুন
      </button>

    </div>

    <div class="card">

      <div class="title">📌 Coin Rate</div>

      <div class="info">
        1,000 Coins = ৳4<br>
        2,000 Coins = ৳8<br>
        5,000 Coins = ৳20<br>
        10,000 Coins = ৳40
      </div>

    </div>

  </div>

  <script>

    function calculateMoney() {

      let coins = Number(document.getElementById("coinInput").value);

      if (isNaN(coins) || coins < 0) {
        coins = 0;
      }

      // 1000 Coins = 4 Taka
      let money = (coins / 1000) * 4;

      document.getElementById("showCoins").innerText =
        coins.toLocaleString();

      document.getElementById("showMoney").innerText =
        money.toFixed(2);
    }

    // Telegram Mini App
    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

  </script>

</body>
</html>
