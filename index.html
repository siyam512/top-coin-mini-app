<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Coin Market</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    .header {
      background: #111827;
      color: white;
      padding: 22px 20px;
      text-align: center;
      border-radius: 0 0 25px 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 7px 0 0;
      opacity: 0.8;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.07);
    }

    .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .rate {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin: 15px 0;
    }

    .rate span {
      color: #16a34a;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 18px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .calculation {
      margin-top: 15px;
      padding: 18px;
      background: #f0fdf4;
      border-radius: 14px;
      text-align: center;
      border: 1px solid #bbf7d0;
    }

    .calculation .small {
      font-size: 14px;
      color: #555;
      margin-bottom: 6px;
    }

    .money {
      font-size: 30px;
      font-weight: bold;
      color: #16a34a;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .submit-button {
      background: #2563eb;
      color: white;
    }

    .clear-button {
      background: #e5e7eb;
      color: #111827;
    }

    .info {
      font-size: 14px;
      line-height: 1.6;
      color: #555;
    }

    .success {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: #dcfce7;
      color: #166534;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Top Coin Market</h1>
    <p>Coin Sell / Market</p>
  </div>

  <div class="container">

    <div class="card">
      <div class="title">বর্তমান কয়েন রেট</div>

      <div class="rate">
        ১,০০০ কয়েন = <span>৳৪</span>
      </div>

      <div class="info">
        নিচে আপনার কয়েনের পরিমাণ লিখুন। টাকা অটোমেটিক হিসাব হয়ে দেখাবে।
      </div>
    </div>


    <div class="card">

      <div class="title">কয়েনের পরিমাণ দিন</div>

      <label for="coins">কয়েন</label>

      <input
        type="number"
        id="coins"
        placeholder="যেমন: 1000"
        min="0"
        oninput="calculateMoney()"
      >

      <div class="calculation">

        <div class="small">
          আপনার কয়েনের মূল্য
        </div>

        <div class="money" id="money">
          ৳0
        </div>

      </div>

      <button class="submit-button" onclick="submitCoins()">
        কয়েন বিক্রি করুন
      </button>

      <button class="clear-button" onclick="clearCoins()">
        পরিষ্কার করুন
      </button>

      <div class="success" id="success">
        আপনার কয়েনের তথ্য নেওয়া হয়েছে।
      </div>

    </div>


    <div class="card">

      <div class="title">হিসাব</div>

      <div class="info">

        ১,০০০ কয়েন = ৳৪<br>
        ২,০০০ কয়েন = ৳৮<br>
        ৩,০০০ কয়েন = ৳১২<br>
        ৫,০০০ কয়েন = ৳২০<br>
        ১০,০০০ কয়েন = ৳৪০

      </div>

    </div>

  </div>


  <script>

    // 1000 coins = 4 taka
    const COINS_PER_1000 = 1000;
    const TAKA_PER_1000 = 4;


    function calculateMoney() {

      const coinInput = document.getElementById("coins");
      const moneyDisplay = document.getElementById("money");

      const coins = Number(coinInput.value);

      if (!coins || coins < 0) {
        moneyDisplay.innerText = "৳0";
        return;
      }

      const money = (coins / COINS_PER_1000) * TAKA_PER_1000;

      moneyDisplay.innerText = "৳" + formatMoney(money);
    }


    function formatMoney(amount) {

      if (Number.isInteger(amount)) {
        return amount.toLocaleString("en-US");
      }

      return amount.toFixed(2);
    }


    function clearCoins() {

      document.getElementById("coins").value = "";
      document.getElementById("money").innerText = "৳0";
      document.getElementById("success").style.display = "none";
    }


    function submitCoins() {

      const coins = Number(
        document.getElementById("coins").value
      );

      if (!coins || coins <= 0) {

        alert("দয়া করে কয়েনের পরিমাণ লিখুন।");
        return;
      }

      const money = (coins / 1000) * 4;

      document.getElementById("success").innerText =
        "আপনার " +
        coins.toLocaleString("en-US") +
        " কয়েনের মূল্য ৳" +
        formatMoney(money) +
        "।";

      document.getElementById("success").style.display = "block";


      // Telegram Mini App
      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.HapticFeedback.impactOccurred("light");
      }
    }


    // Telegram Mini App initialize
    if (window.Telegram && Telegram.WebApp) {

      Telegram.WebApp.ready();
      Telegram.WebApp.expand();

    }

  </script>

</body>
</html>
